[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floclib"
version = "0.3.1"
description = "Flocculation kinetic modelling and retention time simulation toolkit"
authors = [
  { name = "Abayomi O. Bankole", email = "bankoleabayomi3@gmail.com" },
  { name = "Rodrigo Moruzzi",       email = "rodrigo.Moruzzi@unesp.br" },
  { name = "Rogério G. Negri",      email = "rogerio.negri@unesp.br" }
]

maintainers = [
  { name = "Abayomi O. Bankole", email = "bankoleabayomi3@gmail.com" }
]

readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# PyPI trove classifiers. These also feed the shields.io "python versions"
# badge (which reads Programming Language :: Python :: classifiers, not
# requires-python). Keep these in sync with the actually-tested interpreter
# (CI runs 3.12; the numpy/pandas upper pins are not yet 3.13-compatible).
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

# Core runtime deps cover the tabular pipeline only
# (feature table -> Beta -> Ka/Kb -> THRT). Heavy image deps
# live in the [seg] extra so `pip install floclib` stays light.
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.1,<2.2",
    "scipy>=1.10,<2.0",
    "scikit-learn>=1.1,<=1.5",
    "pyswarms>=1.3,<1.4",
    "matplotlib>=3.7,<=3.8",
    "fastparquet>=2023,<=2024.11"
]

[project.optional-dependencies]
# Image segmentation stage (cv2 + scikit-image + imageio). Lazy-imported.
seg = [
    "scikit-image>=0.23,<0.24",
    "opencv-python-headless>=4.6,<5.0",
    "imageio>=2.31"
]
# Pipeline config serialization to/from YAML.
yaml = [
    "pyyaml>=6.0"
]
# Everything (dev install).
all = [
    "scikit-image>=0.23,<0.24",
    "opencv-python-headless>=4.6,<5.0",
    "imageio>=2.31",
    "pyyaml>=6.0"
]
# Test/dev tooling.
dev = [
    "pytest>=7.0",
    "ruff>=0.6"
]

[project.scripts]
floclib = "floclib.cli:main"

[tool.setuptools.packages.find]
# Exact "floclib" plus its subpackages only. A bare "floclib*" glob would
# also match the local `floclib_env` virtualenv directory and bundle the
# whole venv (site-packages, activate scripts) into the wheel.
include = ["floclib", "floclib.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
