name: floclib
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Core scientific stack resolved natively by conda-forge (binaries).
  # Versions mirror pyproject.toml core deps; the [seg] image deps are
  # pulled via pip below (opencv/skimage wheels are reliable on conda too).
  - numpy>=1.24,<2.0
  - pandas>=2.1,<2.2
  - scipy>=1.10,<2.0
  - scikit-learn>=1.1,<=1.5
  - matplotlib>=3.7,<=3.8
  - fastparquet>=2023,<=2024.11
  - pyyaml>=6.0
  - pip
  - pip:
    # Install the local package with the [seg] extra so conda users get the
    # full image-segmentation pipeline. Editable in dev:
    #   pip install -e ".[seg]"
    - pyswarms>=1.3,<1.4
    - scikit-image>=0.23,<0.24
    - opencv-python-headless>=4.6,<5.0
    - imageio>=2.31
    # Install floclib itself from the repo root after conda env creation:
    #   pip install -e .        (tabular only)
    #   pip install -e ".[seg]" (with segmentation)
